[project]
name = "raglab-common"
version = "0.1.0"
description = "Shared benchmarking, logging, and reset conventions for every RAGLab project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "loguru>=0.7.2",
    "litellm>=1.52",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.3.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raglab_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=raglab_common --cov-report=term-missing"
asyncio_mode = "auto"
