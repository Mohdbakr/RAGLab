[project]
name = "plainrag"
version = "0.1.0"
description = "RAG built from scratch: manual chunking, direct embedding calls, a NumPy cosine-similarity index, manual prompt assembly with citations — no RAG framework, no vector-DB service."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.52",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "rich>=13.9",
    "loguru>=0.7.2",
    "typer>=0.15",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
plainrag = "plainrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plainrag"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's calls-in-defaults pattern (`= typer.Option(...)`) is the documented,
# idiomatic way to declare CLI parameters — not a real mutable-default bug.
"src/plainrag/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
