# Registry of RAG backend implementations the unified launcher can start.
#
# Schema (per entry):
#   id                       Unique slug, matches the projects/<id> folder name.
#   name                     Human-readable display name.
#   level                    "basic" | "intermediate" | "advanced" — drives ordering in the UI.
#   summary                  One-line description shown in the dropdown.
#   path                     Path to the project folder, relative to the repo root.
#   needs_container          If false, the backend runs in-process (no Docker lifecycle needed).
#   compose_file             Path to the project's docker-compose file, relative to `path`. Omitted when needs_container is false.
#   base_url                 Base URL the frontend/orchestrator uses to reach the running backend.
#   health_path              HTTP path polled to decide "starting" vs "healthy".
#   compatible_vector_stores List of vectorstores.yaml ids this backend can be pointed at. Empty means "not swappable".
#   stateful                 If true, Reset wipes persisted data (memory/checkpoints/vector data) via `docker compose down -v && up -d`.
#   status                   "planned" | "in_progress" | "shipped" — tracked as each weekend lands.

backends:
  - id: "02-document-qa-foundation"
    name: "Document QA Foundation"
    level: "basic"
    summary: "PDF/DOCX/TXT upload, chunking, and Q&A over a Milvus-backed corpus."
    path: "projects/02-document-qa-foundation"
    needs_container: true
    compose_file: "docker-compose.yaml"
    base_url: "http://localhost:8000"
    health_path: "/"
    compatible_vector_stores: []  # locked to its own Milvus stack for now; not part of the swap-the-vector-store demo
    stateful: true
    status: "in_progress"  # existing app; owner is reviewing it personally before further changes
